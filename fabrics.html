<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Fabric library · Atelier Brown</title><meta name="description" content="Sixteen fabrics rated for heat comfort, weight, creasing, care and budget."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧥%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap"><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><nav class="snav"><a href="index.html">Atelier Brown</a><a href="advisor.html">3D Advisor</a><a href="fabrics.html" class=on>Fabrics</a><a href="planner.html">Planner</a><a href="about.html">About</a><button onclick="tgl()" aria-label="Toggle theme">Light / Dark</button></nav></header>
<div class="page" style="max-width:1040px"><h1>Fabric library</h1><p class="lead">Rated for Indian weather. Tap a season or budget to filter.</p>
<input type="search" id="q" placeholder="Search linen, silk, quick-dry…"><div class="chips" id="fs" style="margin-bottom:8px"></div><div class="chips" id="fp" style="margin-bottom:16px"></div><div class="fgrid" id="g"></div></div><footer>Atelier Brown · inspired by The Brown Skin Style Guide. Sizes, colour detection and fabric advice are guidance, not guarantees.</footer>
<script src="assets/data.js"></script><script>
const $=s=>document.querySelector(s),F={s:'all',p:0,q:''},bar=h=>'●'.repeat(h)+'○'.repeat(5-h),SN={s:'Summer',m:'Monsoon',w:'Winter'};
function render(){
 $('#fs').innerHTML=[['all','All seasons'],['s','Summer'],['m','Monsoon'],['w','Winter']].map(([k,v])=>`<button class="chip${F.s===k?' on':''}" data-s="${k}">${v}</button>`).join('');
 $('#fp').innerHTML=[[0,'Any budget'],[1,'₹'],[2,'Up to ₹₹'],[3,'Up to ₹₹₹']].map(([k,v])=>`<button class="chip${F.p===k?' on':''}" data-p="${k}">${v}</button>`).join('');
 const L=Object.values(FAB).filter(v=>(F.s==='all'||v.s.includes(F.s))&&(!F.p||v.p.length<=F.p)&&(v.n+v.use+v.tip).toLowerCase().includes(F.q));
 $('#g').innerHTML=L.length?L.map(v=>`<div class="card"><h3>${v.n}</h3><div class="row"><span class="bar">${bar(v.h)} heat comfort</span><b>${v.p}</b></div><p class="note"><b>Best for:</b> ${v.use}</p><p class="note">${v.tip}</p><p class="note">Weight ${v.w} · Creasing: ${v.cr}<br>Care: ${v.care}</p>${[...v.s].map(x=>`<span class="tag">${SN[x]}</span>`).join('')}</div>`).join(''):'<p class="note">No fabrics match. Try another filter.</p>'}
document.addEventListener('click',e=>{const s=e.target.closest('[data-s]'),p=e.target.closest('[data-p]');if(s)F.s=s.dataset.s;else if(p)F.p=+p.dataset.p;else return;render()});
$('#q').oninput=e=>{F.q=e.target.value.toLowerCase().trim();render()};render();
</script></body></html>
